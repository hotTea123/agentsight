language = "C"
include_guard = "AGENTSIGHT_H"
cpp_compat = true
usize_is_size_t = true
documentation = true
autogen_warning = "/* Generated from Rust declarations. Do not edit by hand. */"
header = "/* AgentSight tool-span evidence ABI v1. See README.md for ownership and threading rules. */"

[parse]
parse_deps = false

[export]
exclude = ["CoreConfig", "as_core_open", "as_core_poll", "as_core_close"]
