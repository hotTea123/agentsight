[package]
name = "agentsight-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "In-process tool-span evidence capture, with a C ABI for native hosts"
build = "build.rs"

[lib]
name = "agentsight"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
serde_json = "1.0"

[build-dependencies]
cbindgen = "=0.29.2"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
